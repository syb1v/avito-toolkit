# Локальная разработка: воркер использует Chromium с хоста (без скачивания в образ).
# Сервер собирается обычным `docker compose build worker` (INSTALL_BROWSER=1).
#
# Запуск (Makefile сам подставит PLAYWRIGHT_BROWSERS_DIR):
#   make up-dev
# или вручную:
#   PLAYWRIGHT_BROWSERS_DIR=$HOME/.cache/ms-playwright \
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build worker

services:
  worker:
    build:
      args:
        INSTALL_BROWSER: "0"
    # Тот же профиль, что у scripts/browser_login.py и scripts/import_cookies.py
    # на хосте: cookies из вашего браузера подхватываются воркером автоматически.
    environment:
      BROWSER_USER_DATA_DIR: /srv/.browser-profile
    volumes:
      - ${PLAYWRIGHT_BROWSERS_DIR:?Укажите PLAYWRIGHT_BROWSERS_DIR (кэш ms-playwright)}:/ms-playwright:ro
      - ./backend:/srv
