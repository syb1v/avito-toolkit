name: avito-toolkit

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://avito:avito@postgres:5432/avito
  REDIS_URL: redis://redis:6379/0
  LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-chat}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
  PROXY_ENABLED: ${PROXY_ENABLED:-false}
  PROXY_URL: ${PROXY_URL:-}
  PROXY_LIST: ${PROXY_LIST:-}
  PROXY_ROTATION: ${PROXY_ROTATION:-round_robin}
  PROXY_MAX_FAILURES: ${PROXY_MAX_FAILURES:-3}
  PROXY_COOLDOWN_SECONDS: ${PROXY_COOLDOWN_SECONDS:-300}
  PROXY_ANTIBOT_COOLDOWN_SECONDS: ${PROXY_ANTIBOT_COOLDOWN_SECONDS:-1800}
  PROXY_HEALTHCHECK_ENABLED: ${PROXY_HEALTHCHECK_ENABLED:-true}
  PROXY_HEALTHCHECK_URL: ${PROXY_HEALTHCHECK_URL:-https://api.ipify.org?format=json}
  PROXY_HEALTHCHECK_INTERVAL_MINUTES: ${PROXY_HEALTHCHECK_INTERVAL_MINUTES:-15}
  CRAWL_RATE_PER_MINUTE: ${CRAWL_RATE_PER_MINUTE:-12}
  CRAWL_MAX_PAGES_PER_RUN: ${CRAWL_MAX_PAGES_PER_RUN:-10}
  CRAWL_DELAY_MIN_SECONDS: ${CRAWL_DELAY_MIN_SECONDS:-8}
  CRAWL_DELAY_MAX_SECONDS: ${CRAWL_DELAY_MAX_SECONDS:-20}
  CRAWL_MIN_INTERVAL_MINUTES: ${CRAWL_MIN_INTERVAL_MINUTES:-30}
  CRAWL_CHALLENGE_COOLDOWN_MINUTES: ${CRAWL_CHALLENGE_COOLDOWN_MINUTES:-60}
  CRAWL_RATE_LIMIT_COOLDOWN_MINUTES: ${CRAWL_RATE_LIMIT_COOLDOWN_MINUTES:-90}
  CRAWL_BREAKER_FAILURES: ${CRAWL_BREAKER_FAILURES:-3}
  CRAWL_BREAKER_MINUTES: ${CRAWL_BREAKER_MINUTES:-120}
  WORKER_PAUSE_MIN_SECONDS: ${WORKER_PAUSE_MIN_SECONDS:-2}
  WORKER_PAUSE_MAX_SECONDS: ${WORKER_PAUSE_MAX_SECONDS:-7}
  BROWSER_HUMANIZE: ${BROWSER_HUMANIZE:-true}
  BROWSER_BLOCK_RESOURCES: ${BROWSER_BLOCK_RESOURCES:-false}
  # На сервере без X-сервера обязателен headless=true (Dockerfile.browser ENV false).
  BROWSER_HEADLESS: ${BROWSER_HEADLESS:-false}
  ACCOUNT_CHECK_COOLDOWN_MINUTES: ${ACCOUNT_CHECK_COOLDOWN_MINUTES:-10}
  WORKER_ALIVE_WINDOW_SECONDS: ${WORKER_ALIVE_WINDOW_SECONDS:-120}
  WATCHDOG_INTERVAL_MINUTES: ${WATCHDOG_INTERVAL_MINUTES:-5}
  WATCHDOG_QUEUE_WARN_DEPTH: ${WATCHDOG_QUEUE_WARN_DEPTH:-25}
  ACCOUNT_DAILY_PAGE_LIMIT: ${ACCOUNT_DAILY_PAGE_LIMIT:-80}
  ACCOUNT_REST_MINUTES: ${ACCOUNT_REST_MINUTES:-180}
  ACCOUNT_WARMUP_ENABLED: ${ACCOUNT_WARMUP_ENABLED:-true}
  ACCOUNT_WARMUP_IDLE_HOURS: ${ACCOUNT_WARMUP_IDLE_HOURS:-12}
  ACCOUNT_WARMUP_INTERVAL_MINUTES: ${ACCOUNT_WARMUP_INTERVAL_MINUTES:-60}
  ACCOUNT_WARMUP_MAX_PER_RUN: ${ACCOUNT_WARMUP_MAX_PER_RUN:-3}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_LOGIN: ${TELEGRAM_LOGIN:-admin}
  TELEGRAM_PASSWORD: ${TELEGRAM_PASSWORD:-}
  TELEGRAM_SESSION_DAYS: ${TELEGRAM_SESSION_DAYS:-30}
  SELLER_EDIT_MODE: ${SELLER_EDIT_MODE:-dry_run}
  SELLER_EDIT_MAX_PER_RUN: ${SELLER_EDIT_MAX_PER_RUN:-5}
  AVITO_EDIT_URL_TEMPLATE: ${AVITO_EDIT_URL_TEMPLATE:-https://www.avito.ru/items/edit/{item_id}}
  AVITO_CLIENT_ID: ${AVITO_CLIENT_ID:-}
  AVITO_CLIENT_SECRET: ${AVITO_CLIENT_SECRET:-}
  REPRICE_HITL_THRESHOLD_PCT: ${REPRICE_HITL_THRESHOLD_PCT:-10}
  REPRICE_MAX_STEP_PCT: ${REPRICE_MAX_STEP_PCT:-5}
  MODERATION_ENABLED: ${MODERATION_ENABLED:-true}
  MODERATION_AI_ENABLED: ${MODERATION_AI_ENABLED:-true}
  MODERATION_LOW_PRICE_RATIO: ${MODERATION_LOW_PRICE_RATIO:-0.35}
  MODERATION_DUPLICATE_MIN_CLUSTER: ${MODERATION_DUPLICATE_MIN_CLUSTER:-5}
  MODERATION_AI_BATCH_SIZE: ${MODERATION_AI_BATCH_SIZE:-10}
  MODERATION_MAX_AI_ITEMS: ${MODERATION_MAX_AI_ITEMS:-40}
  MODERATION_DESCRIPTIONS_ENABLED: ${MODERATION_DESCRIPTIONS_ENABLED:-true}
  MODERATION_DESCRIPTION_MAX_ITEMS: ${MODERATION_DESCRIPTION_MAX_ITEMS:-10}
  MODERATION_DESCRIPTION_DELAY_MIN_SECONDS: ${MODERATION_DESCRIPTION_DELAY_MIN_SECONDS:-3}
  MODERATION_DESCRIPTION_DELAY_MAX_SECONDS: ${MODERATION_DESCRIPTION_DELAY_MAX_SECONDS:-6}

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: avito
      POSTGRES_PASSWORD: avito
      POSTGRES_DB: avito
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avito -d avito"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.browser
    restart: unless-stopped
    environment:
      <<: *backend-env
      PYTHONPATH: /srv
      BROWSER_NO_SANDBOX: "true"
      BROWSER_USER_DATA_DIR: /data/browser-profile
    volumes:
      - browserdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  telegram:
    build: ./backend
    restart: unless-stopped
    command: python -m app.telegram_bot
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build: ./backend
    restart: unless-stopped
    command: python -m app.scheduler
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        # пусто = относительные /api-запросы (прод за nginx); локально — localhost:8000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-http://localhost:8000}
    restart: unless-stopped
    environment:
      API_URL_INTERNAL: http://api:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  browserdata:
