server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # docker DNS: upstream-контейнеры могут пересоздаваться с новым IP
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $web_upstream http://web:3000;

    # Healthcheck доступен без пароля (для деплоя/мониторинга)
    location = /healthz {
        auth_basic off;
        proxy_pass $api_upstream/healthz;
    }

    # Всё остальное — под Basic Auth (логин/пароль из deploy/.htpasswd)
    auth_basic "Avito Toolkit";
    auth_basic_user_file /opt/deploy/.htpasswd;

    # API (через internal-сеть docker compose)
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /docs {
        proxy_pass $api_upstream/docs;
    }

    location /openapi.json {
        proxy_pass $api_upstream/openapi.json;
    }

    location /redoc {
        proxy_pass $api_upstream/redoc;
    }

    # Панель Next.js
    location / {
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
