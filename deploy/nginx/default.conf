server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Healthcheck доступен без пароля (для деплоя/мониторинга)
    location = /healthz {
        auth_basic off;
        proxy_pass http://api:8000/healthz;
    }

    # Всё остальное — под Basic Auth (логин/пароль из deploy/.htpasswd)
    auth_basic "Avito Toolkit";
    auth_basic_user_file /opt/deploy/.htpasswd;

    # API (через internal-сеть docker compose)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /docs {
        proxy_pass http://api:8000/docs;
    }

    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
    }

    location /redoc {
        proxy_pass http://api:8000/redoc;
    }

    # Панель Next.js
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
