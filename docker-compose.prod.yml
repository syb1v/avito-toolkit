# Прод-оверлей для сервера: наружу только 80 (nginx), БД/Redis/API/фронт — внутри.
# Запуск: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# (или через deploy/deploy.sh)
services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  api:
    ports: !reset []
    environment:
      BROWSER_USER_DATA_DIR: /data/browser-profile
    volumes:
      # тот же том, что у воркера: панель видит, создан ли профиль
      - browserdata:/data
  web:
    ports: !reset []
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # каталоги, а не файлы: новые inode видны без пересоздания контейнера
      - ./deploy/nginx:/etc/nginx/conf.d:ro
      - ./deploy:/opt/deploy:ro
    depends_on:
      - web
      - api
