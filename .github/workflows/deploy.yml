name: Deploy

on:
  # push тега (git push origin vX.Y.Z): надёжно срабатывает в отличие от
  # release: published, которое не триггерит workflow-ы, созданные GITHUB_TOKEN
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 60m
          script_stop: true
          script: |
            set -e
            cd /opt/avito-toolkit
            git fetch --all --tags --prune
            git reset --hard origin/main
            bash deploy/deploy.sh
