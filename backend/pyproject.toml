[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avito-toolkit-backend"
dynamic = ["version"]
description = "Avito market analytics and mass listing management backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "redis>=5.1",
    "httpx[socks]>=0.27",
    "curl-cffi>=0.7",
    "dramatiq[redis]>=1.17",
    "apscheduler>=3.10",
    "croniter>=6.0",
    "litellm>=1.51",
    "polars>=1.9",
    "rapidfuzz>=3.10",
    "lxml>=5.3",
    "tenacity>=9.0",
    "structlog>=24.4",
    "browser-cookie3>=0.20",
    "openpyxl>=3.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
browser = ["patchright>=1.49"]
browser-heavy = ["camoufox>=0.4"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.30",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
